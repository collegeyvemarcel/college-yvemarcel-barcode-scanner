<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>College Yvemarcel Barcode Scanner</title>
<script src="https://unpkg.com/html5-qrcode"></script>
<style>
*{box-sizing:border-box} body{font-family:Arial,sans-serif;background:#f1f4f9;text-align:center;padding:16px;color:#222;margin:0}
.container{width:100%;max-width:560px;margin:12px auto;background:white;padding:20px;border-radius:14px;box-shadow:0 2px 10px #0002}
h2{color:#174b9b;margin:4px 0 8px} #reader{width:100%;margin:18px auto 8px;overflow:hidden;border-radius:8px}
button,select{width:100%;padding:14px;margin-top:10px;border:0;border-radius:8px;font-size:16px}
button{background:#174b9b;color:white;font-weight:bold;cursor:pointer}button.secondary{background:#666}
button:disabled{opacity:.55;cursor:not-allowed}select{border:1px solid #bbb;background:white}
#status{margin:14px 0 4px;color:#444;min-height:42px;line-height:1.4}#tools{display:none}
#zoomLabel{display:block;margin-top:12px}#zoom{width:100%}.hint{color:#666;font-size:13px;line-height:1.45}
</style>
</head>
<body>
<div class="container">
<h2>College Yvemarcel</h2><p>Student Barcode Scanner</p>
<label for="cameraSelect" class="hint">Camera</label>
<select id="cameraSelect" aria-label="Choose camera"><option value="">Automatic camera selection</option></select>
<div id="reader"></div>
<button id="startButton" onclick="startScanner()">START SCANNER</button>
<button id="stopButton" class="secondary" onclick="stopScanner()" disabled>STOP CAMERA</button>
<div id="tools">
<button id="torchButton" class="secondary" onclick="toggleTorch()" style="display:none">TURN ON LIGHT</button>
<label id="zoomLabel" for="zoom" style="display:none">Camera zoom</label>
<input id="zoom" type="range" min="1" max="1" step="0.1" value="1" style="display:none">
</div>
<p id="status">Ready to scan a student barcode.</p>
<p class="hint">Place the barcode in the centre of the frame. Keep the card flat, avoid glare, and allow the camera a moment to focus.</p>
</div>
<script>
const staffFormUrl="https://script.google.com/macros/s/AKfycbwstz-jUITaHs9vENyIt64YenKGZ_kyXBmh4gxFPSzg4yOieiTSDb2V0XDXI1aVcVRS/exec";
const registrationFormUrl = staffFormUrl + '?page=register';
let scanner=null,scanning=false,torchOn=false;
const statusEl=document.getElementById("status");
const cameraSelect=document.getElementById("cameraSelect");
const startButton=document.getElementById("startButton");
const stopButton=document.getElementById("stopButton");
const tools=document.getElementById("tools");
const torchButton=document.getElementById("torchButton");
const zoom=document.getElementById("zoom");
const zoomLabel=document.getElementById("zoomLabel");
function showStatus(message){statusEl.textContent=message;}

async function loadCameras(){
 try{
  const cameras=await Html5Qrcode.getCameras();
  const previous=cameraSelect.value;
  cameraSelect.innerHTML='<option value="">Automatic camera selection</option>';
  cameras.forEach((camera,index)=>{
   const option=document.createElement("option");
   option.value=camera.id;option.textContent=camera.label||("Camera "+(index+1));
   cameraSelect.appendChild(option);
  });
  if(previous&&cameras.some(camera=>camera.id===previous))cameraSelect.value=previous;
  else{
   const back=cameras.find(camera=>/back|rear|environment/i.test(camera.label||""));
   if(back)cameraSelect.value=back.id;
  }
 }catch(e){}
}

async function startScanner(){
 if(scanning)return;
 try{
  showStatus("Starting camera and requesting the highest practical resolution...");
  startButton.disabled=true;
  if(scanner){try{await scanner.clear();}catch(e){} scanner=null;}
  scanner=new Html5Qrcode("reader",{
   formatsToSupport:[
    Html5QrcodeSupportedFormats.EAN_13,Html5QrcodeSupportedFormats.EAN_8,
    Html5QrcodeSupportedFormats.CODE_128,Html5QrcodeSupportedFormats.CODE_39,
    Html5QrcodeSupportedFormats.UPC_A,Html5QrcodeSupportedFormats.UPC_E,
    Html5QrcodeSupportedFormats.ITF,Html5QrcodeSupportedFormats.CODABAR,
    Html5QrcodeSupportedFormats.QR_CODE
   ],verbose:false
  });
  const cameraConfig=cameraSelect.value?cameraSelect.value:{facingMode:"environment"};
  await scanner.start(cameraConfig,{
   fps:15,aspectRatio:16/9,disableFlip:true,
   qrbox:function(w,h){return {width:Math.floor(w*.94),height:Math.floor(h*.48)};},
   videoConstraints:{
    width:{ideal:1920},height:{ideal:1080},
    facingMode:{ideal:"environment"},
    advanced:[{focusMode:"continuous"}]
   }
  },function(decodedText){
   if(!scanning)return;
   scanning=false;
   showStatus("Barcode detected: "+decodedText+". Opening transaction form...");
   startButton.disabled=false;stopButton.disabled=true;
   scanner.stop().catch(function(){}).finally(function(){
    window.location.href=staffFormUrl+"?barcode="+encodeURIComponent(decodedText);
   });
  },function(){});
  scanning=true;stopButton.disabled=false;startButton.disabled=false;
  showStatus("Camera active. Hold the barcode steady inside the frame.");
  await configureCameraControls();
 }catch(error){
  scanning=false;startButton.disabled=false;stopButton.disabled=true;
  showStatus("Camera error: "+(error.message||error)+". Check camera permission, then try again.");
 }
}

async function configureCameraControls(){
 tools.style.display="block";torchButton.style.display="none";
 zoom.style.display="none";zoomLabel.style.display="none";torchOn=false;
 try{
  const caps=scanner.getRunningTrackCapabilities();
  if(caps&&caps.torch){torchButton.style.display="block";torchButton.textContent="TURN ON LIGHT";}
  if(caps&&caps.zoom){
   zoom.min=caps.zoom.min;zoom.max=caps.zoom.max;zoom.step=caps.zoom.step||.1;
   zoom.value=caps.zoom.min;zoom.style.display="block";zoomLabel.style.display="block";
  }
  try{await scanner.applyVideoConstraints({advanced:[{focusMode:"continuous"}]});}catch(e){}
 }catch(e){}
}
async function toggleTorch(){
 if(!scanner||!scanning)return;
 try{
  torchOn=!torchOn;
  await scanner.applyVideoConstraints({advanced:[{torch:torchOn}]});
  torchButton.textContent=torchOn?"TURN OFF LIGHT":"TURN ON LIGHT";
 }catch(e){torchOn=false;showStatus("This camera or browser does not support the light control.");}
}
zoom.addEventListener("input",async function(){
 if(!scanner||!scanning)return;
 try{await scanner.applyVideoConstraints({advanced:[{zoom:Number(zoom.value)}]});}
 catch(e){showStatus("Zoom control is not supported by this camera/browser.");}
});
async function stopScanner(){
 if(scanner&&scanning){
  try{await scanner.stop();await scanner.clear();}catch(e){}
 }
 scanning=false;torchOn=false;startButton.disabled=false;stopButton.disabled=true;
 tools.style.display="none";showStatus("Camera stopped.");
}
loadCameras();
</script>
</body>
</html>
